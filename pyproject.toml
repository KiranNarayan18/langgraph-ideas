[project]
name = "agentic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kiran Narayan", email = "" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.19",
    "python-dotenv>=1.2.4",
    "langchain_exa"
]

[project.scripts]
agentic = "agentic:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "langchain",
    "langgraph",
    "langchain-groq"
]
